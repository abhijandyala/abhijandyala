<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-label="Skills: AI agents and browser automation, full-stack SaaS, computer vision and ML, simulation and geospatial">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .card { fill: #0D1117; stroke: #30363D; stroke-width: 1; }
    .row { opacity: 0; animation: in .7s ease-out forwards; }
    .fill { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
    .r1, .r1 .fill { animation-delay: .1s; } .r2, .r2 .fill { animation-delay: .3s; }
    .r3, .r3 .fill { animation-delay: .5s; } .r4, .r4 .fill { animation-delay: .7s; }
    @keyframes in { to { opacity: 1; } }
    @keyframes grow { to { transform: scaleX(1); } }
    .track { fill: #21262D; }
    .dot { fill: #A78BFA; }
    .l { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E6EDF3; }
    .s { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8B949E; }
  </style>
  <rect class="card" x="1" y="1" width="358" height="298" rx="14"/>

  <g class="row r1">
    <circle class="dot" cx="24" cy="30" r="4"/>
    <text class="l" x="36" y="35">AI Agents &amp; Browser Automation</text>
    <rect class="track" x="18" y="46" width="324" height="8" rx="4"/>
    <rect class="fill" x="18" y="46" width="324" height="8" rx="4" fill="url(#bar)"/>
    <text class="s" x="18" y="74">shipping @ ValiqAI</text>
  </g>
  <g class="row r2">
    <circle class="dot" cx="24" cy="100" r="4" style="fill:#60A5FA"/>
    <text class="l" x="36" y="105">Full-Stack SaaS</text>
    <rect class="track" x="18" y="116" width="324" height="8" rx="4"/>
    <rect class="fill" x="18" y="116" width="324" height="8" rx="4" fill="url(#bar)"/>
    <text class="s" x="18" y="144">Next.js · React · FastAPI</text>
  </g>
  <g class="row r3">
    <circle class="dot" cx="24" cy="170" r="4" style="fill:#22D3EE"/>
    <text class="l" x="36" y="175">Computer Vision &amp; ML</text>
    <rect class="track" x="18" y="186" width="324" height="8" rx="4"/>
    <rect class="fill" x="18" y="186" width="259" height="8" rx="4" fill="url(#bar)"/>
    <text class="s" x="18" y="214">YOLO-World on H100s</text>
  </g>
  <g class="row r4">
    <circle class="dot" cx="24" cy="240" r="4" style="fill:#34D399"/>
    <text class="l" x="36" y="245">Simulation &amp; Geospatial</text>
    <rect class="track" x="18" y="256" width="324" height="8" rx="4"/>
    <rect class="fill" x="18" y="256" width="227" height="8" rx="4" fill="url(#bar)"/>
    <text class="s" x="18" y="284">Kalman + Monte Carlo</text>
  </g>
</svg>
