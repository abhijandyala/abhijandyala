<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-label="Abhi Jandyala. Founder and CEO of ValiqAI. Building AI agents that work outside of demos.">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C3AED"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .in { opacity: 0; animation: in 1s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .45s; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .bar { transform-box: fill-box; transform-origin: center; transform: scaleX(0); animation: grow 1.2s .35s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .name { font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F0F3F6; letter-spacing: -1px; }
    .role { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #C9D1D9; }
    .tag { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8B949E; }
  </style>
  <rect x="1" y="1" width="358" height="218" rx="16" fill="#0D1117" stroke="#30363D"/>
  <rect x="1" y="1" width="358" height="218" rx="16" fill="url(#glow)"/>
  <text class="name in d1" x="180" y="76" text-anchor="middle">Abhi Jandyala</text>
  <rect class="bar" x="135" y="94" width="90" height="2" rx="1" fill="url(#line)"/>
  <text class="role in d2" x="180" y="128" text-anchor="middle">Founder &amp; CEO of ValiqAI</text>
  <text class="tag in d2" x="180" y="152" text-anchor="middle">17  ·  Waxhaw, NC</text>
  <text class="tag in d3" x="180" y="180" text-anchor="middle">Building AI agents that work outside of demos</text>
</svg>
